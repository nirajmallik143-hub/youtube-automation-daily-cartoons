name: YouTube Automation

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish uploaded videos publicly'
        required: false
        default: 'true'
  schedule:
    - cron: '0 16 * * *' # runs at 16:00 UTC daily

concurrency:
  group: youtube-automation
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: UTC

jobs:
  automation:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve publish mode
        id: run_config
        run: |
          PUBLISH="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish || 'true' }}"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "Publish mode: ${PUBLISH}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt is missing; workflow cannot run automation scripts."
            exit 1
          fi
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate automation scripts
        run: |
          python -m compileall scripts
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Generate topic
        run: |
          mkdir -p out
          python scripts/generate_topic.py --output out/topic.txt

      - name: Generate script
        run: |
          python scripts/generate_script.py --topic-file out/topic.txt --output out/script.txt

      - name: Render long video
        run: |
          python scripts/render_video.py --script-file out/script.txt --out out/video.mp4

      - name: Render short video
        run: |
          python scripts/render_short.py --script-file out/script.txt --out out/short.mp4

      - name: Upload generated assets
        uses: actions/upload-artifact@v4
        with:
          name: youtube-assets
          path: out/
          if-no-files-found: error

      - name: Validate YouTube secrets
        if: success() && steps.run_config.outputs.publish == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          missing=()
          for secret_name in YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN; do
            if [ -z "${!secret_name}" ]; then
              missing+=("$secret_name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets for YouTube upload: ${missing[*]}"
            exit 1
          fi

      - name: Upload long video to YouTube
        if: success() && steps.run_config.outputs.publish == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          TOPIC="$(cat out/topic.txt)"
          python scripts/upload_to_youtube.py \
            --file out/video.mp4 \
            --title "Daily Cartoon - ${TOPIC}" \
            --description "Automated daily cartoon episode." \
            --publish true

      - name: Upload short video to YouTube
        if: success() && steps.run_config.outputs.publish == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          TOPIC="$(cat out/topic.txt)"
          python scripts/upload_to_youtube.py \
            --file out/short.mp4 \
            --title "Daily Cartoon Short - ${TOPIC}" \
            --description "Automated daily cartoon short. #shorts" \
            --publish true \
            --tags cartoon kids animation shorts

      - name: Skip upload notice
        if: success() && steps.run_config.outputs.publish != 'true'
        run: echo "Publish=false requested; generated assets are available in artifacts only."
